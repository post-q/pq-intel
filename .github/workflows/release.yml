name: release

on:
  push:
    tags:
      - "pq-core-v*"
      - "pq-map-v*"
      - "pq-pulse-v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tool: ${{ steps.meta.outputs.tool }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches the crate's Cargo.toml version
        id: meta
        run: |
          tool="${GITHUB_REF_NAME%-v*}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r --arg tool "$tool" '.packages[] | select(.name == $tool) | .version')"
          # Strip the "<crate>-v" prefix, not the first dash: crate names
          # contain dashes themselves (pq-map-v0.8.1 -> v0.8.1).
          if [ "${GITHUB_REF_NAME#"$tool"-v}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match ${tool}'s Cargo.toml version v${version}"
            exit 1
          fi
          echo "tool=$tool" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Binary artifacts. The library tag has no binary to ship.
  build:
    needs: verify
    if: needs.verify.outputs.tool != 'pq-core'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TOOL: ${{ needs.verify.outputs.tool }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build the tagged tool
        run: cargo build --release --package "$TOOL" --target ${{ matrix.target }}
      - name: Package
        run: |
          version="${{ needs.verify.outputs.version }}"
          dir="${TOOL}-v${version}-${{ matrix.target }}"
          mkdir "${dir}"
          cp "target/${{ matrix.target }}/release/${TOOL}" "${dir}/"
          cp "apps/${TOOL}/README.md" "apps/${TOOL}/LICENSE" "${dir}/"
          tar -czf "${dir}.tar.gz" "${dir}"
          if command -v sha256sum >/dev/null; then
            sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          else
            shasum -a 256 "${dir}.tar.gz" > "${dir}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TOOL }}-${{ matrix.target }}
          path: |
            ${{ env.TOOL }}-*.tar.gz
            ${{ env.TOOL }}-*.tar.gz.sha256
          if-no-files-found: error

  # GitHub release: changelog, notes, binary artifacts (tool tags only).
  release:
    needs: [verify, build]
    if: needs.verify.outputs.tool != 'pq-core'
    runs-on: ubuntu-latest
    env:
      TOOL: ${{ needs.verify.outputs.tool }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: apps/${{ env.TOOL }}/cliff.toml
          args: --verbose
        env:
          OUTPUT: apps/${{ env.TOOL }}/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "apps/${TOOL}/CHANGELOG.md"
          if git diff --cached --quiet; then
            echo "CHANGELOG.md unchanged"
          else
            git commit -m "chore(release): update ${TOOL} CHANGELOG.md for ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: apps/${{ env.TOOL }}/cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: ${{ env.TOOL }}-*
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            dist/${TOOL}-*.tar.gz dist/${TOOL}-*.tar.gz.sha256

  # crates.io: exactly one crate per tag. pq-core must be published
  # before (or at the same time as) the tools that depend on it; the
  # retries absorb registry index lag right after a fresh pq-core
  # publish. Requires the CARGO_REGISTRY_TOKEN repo secret (token must
  # own pq-map/pq-pulse on the registry).
  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      TOOL: ${{ needs.verify.outputs.tool }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish ${{ needs.verify.outputs.tool }} to crates.io
        run: |
          for attempt in 1 2 3 4 5; do
            if cargo publish --package "$TOOL"; then
              echo "$TOOL published to crates.io"
              exit 0
            fi
            echo "::warning::publish attempt ${attempt} failed; retrying after 30s (registry index lag after a fresh pq-core publish)"
            sleep 30
          done
          exit 1
